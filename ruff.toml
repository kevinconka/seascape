target-version = "py313"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "C90", # mccabe
    "PL",  # pylint
]
ignore = [
    "PLC0415", # imports deferred so `schema` and `--help` skip loading bpy
    "PLR2004", # literals sit beside the source they cite
]

[lint.pylint]
max-args = 8

[format]
docstring-code-format = true
