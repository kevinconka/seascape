# Two pods on the bridge wings, both forward-facing.
#
# Pod axis +-60 deg from the bow; the spec's mounting angle is 58.5.
#
# EO: 129 deg per pod, 9 deg overlap. IR: one camera per pod, turned inboard so the
# pair straddles the bow, 44 deg across with 4 deg overlap.
# `test_pod_span_and_overlap_measured_from_the_scene` holds these.
#
# Headroom above the horizon is half the vertical field minus the pitch.
#
# Offsets: bridge-wing tops of the container_ship mesh, measured on the fitted hull.

# 2 m of bracket above the wing top keeps the deck plate out of every lower frame
# edge. `test_a_pod_stands_on_the_ship_rather_than_beside_it` holds the bracket.
height_m = 51.8
pitch_deg = 0.0

[[pods]]
name = "port"
yaw_deg = -60.0
# Real lateral separation: the pods overlap in angle but only cross in space a few
# hundred metres out, leaving a blind wedge ahead.
offset_x_m = -21.5
offset_y_m = -68.2

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_P"
yaw_deg = -40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_C"
yaw_deg = 0.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_S"
yaw_deg = 40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "ir"
name = "IR_PORT"
# Inboard, so the pair straddles the bow.
yaw_deg = +50.0
pitch_deg = -6.0

[[pods]]
name = "starboard"
yaw_deg = +60.0
offset_x_m = +21.5
offset_y_m = -68.2

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_P"
yaw_deg = -40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_C"
yaw_deg = 0.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_S"
yaw_deg = 40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "ir"
name = "IR_STBD"
yaw_deg = -50.0
pitch_deg = -6.0
