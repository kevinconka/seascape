# Two pods on the bridge wings, both forward-facing. Eight cameras.
#
# Pod axis +-60 deg from the bow.
#
# EO: 3 x 49 deg at 40 deg apart = 129 deg per pod, 9 deg overlap, 249 deg total.
# IR: 50 deg inboard of the pod axis = +-10 deg off the bow, 44 deg pair, 4 deg overlap.
#
# Headroom above the horizon is half the vertical field minus the pitch: 4.4 deg EO
# (28.8 deg field), 3.7 deg IR (19.3 deg).
#
# Offsets: bridge-wing tops of the container_ship mesh, +-21.5 m (half the 43 m beam)
# and 68.2 m aft of midships.

# Wing top is 49.8 m; 2 m of bracket keeps the deck plate out of every lower frame edge.
height_m = 51.8
pitch_deg = 0.0

[[pods]]
name = "port"
yaw_deg = -60.0
# Real lateral separation: the pods overlap in angle but only cross in space a few
# hundred metres out, leaving a blind wedge ahead.
offset_x_m = -21.5
offset_y_m = -68.2

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_P"
yaw_deg = -40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_C"
yaw_deg = 0.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_PORT_S"
yaw_deg = 40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "ir"
name = "IR_PORT"
# Inboard, so the pair straddles the bow at +-10 deg.
yaw_deg = +50.0
pitch_deg = -6.0

[[pods]]
name = "starboard"
yaw_deg = +60.0
offset_x_m = +21.5
offset_y_m = -68.2

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_P"
yaw_deg = -40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_C"
yaw_deg = 0.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "eo"
name = "EO_STBD_S"
yaw_deg = 40.0
pitch_deg = -10.0

[[pods.cameras]]
preset = "ir"
name = "IR_STBD"
yaw_deg = -50.0
pitch_deg = -6.0
