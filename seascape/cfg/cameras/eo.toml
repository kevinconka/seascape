# Daylight camera.
#
# Native resolution: a 25 x 12 m merchant at 7 NM is cd = sqrt(8.66 x 4.16) = 6.00 px,
# exactly the Johnson detection limit the pod is specified against -- at this field of
# view the margin is gone. Downsample in the pipeline, never render smaller.
kind = "eo"
# 3 per pod at 40 deg apart: a 129 deg pod span with 9 deg of overlap between lenses.
hfov_deg = 49.0
width_px = 3840
height_px = 2160
