#:schema ../schema/scenario.json

# The rig as installed: two pods on a container ship's bridge wings, a ring of
# traffic at 7 NM.

extends = "baseline.toml"

[rig]
# baseline lowers this to 12 m for the shader tests and `extends` carries it along.
height_m = 51.8

[ownship]
asset = "container_ship"

[targets]
asset = "container_ship"
# 7 NM, the EO detection range the pod is specified against.
range_m = 12964.0
# One per camera: 35 deg apart across 245 deg of EO. `test_twin_pod` holds it.
count = 8
bearing_deg = [-120.0, 120.0]
