#:schema ../schema/scenario.json

# The rig as installed: two pods on a container ship's bridge wings, a ring of
# traffic at 7 NM. The preset carries the pods and their 51.8 m height.

seed = 20260920

[rig]
preset = "twin_pod"

[sea]
# Warmer than the air, the norm at sea.
t_sea_k = 291.0

[sky]
# Keeps the sun disc and its glitter out of frame.
sun_bearing_deg = 135.0

[ownship]
asset = "container_ship"
# Illustrative, not measured.
roll_deg = 2.0
pitch_deg = 0.5

[targets]
asset = "container_ship"
# 7 NM, the EO detection range the pod is specified against.
range_m = 12964.0
# One per camera: 35 deg apart across 249 deg of EO. `test_twin_pod` holds it.
count = 8
bearing_deg = [-120.0, 120.0]

# Two closer ships, one for each thermal camera: the IR pair spans 44 deg either side
# of the bow, so a bearing inside one pod's 24 deg sector is outside the other's.
[[objects]]
preset = "container_ship"
range_m = 3704.0  # 2 NM, on the port IR's axis
bearing_deg = -10.0
heading_deg = 80.0  # beam-on, so it presents its length

[[objects]]
preset = "container_ship"
range_m = 7408.0  # 4 NM, on the starboard IR's axis
bearing_deg = 10.0
heading_deg = 280.0
