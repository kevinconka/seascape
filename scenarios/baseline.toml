#:schema ../schema/scenario.json

# The smallest useful scene: one pod, one camera per band, one ship. Tests measure
# against these numbers, so write a variant that extends it rather than editing it.

seed = 20260920

[rig]
height_m = 12.0

[[rig.pods]]
name = "bow"
yaw_deg = 0.0

[[rig.pods.cameras]]
kind = "eo"
hfov_deg = 45.0
width_px = 1920
height_px = 1080

[[rig.pods.cameras]]
kind = "ir"
hfov_deg = 24.0
width_px = 640
height_px = 512

[sea]
# Warmer than the air, which is the norm at sea by under 1 K in the global mean
# (Kara et al. 2007, doi:10.1029/2006JC003833). 3 K here for a clearer thermal scene.
t_sea_k = 291.0

[sky]
# Keeps the sun disc and its glitter out of frame.
sun_bearing_deg = 135.0

[[objects]]
preset = "container_ship"
range_m = 2000.0
# Inside the narrower IR frame, so both cameras see it.
bearing_deg = 8.0
heading_deg = 250.0
