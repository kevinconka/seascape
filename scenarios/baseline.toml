#:schema ../schema/scenario.json

# Tests measure against these numbers. Write a variant that extends this file rather
# than editing it.

seed = 20260920

[rig]
preset = "twin_pod"
height_m = 12.0

[sea]
# 3 K above the air. A sea at exactly air temperature is degenerate in LWIR: a
# tilted facet then trades emission for reflected sky of the same radiance and the
# waves disappear. The difference is the entire wave signal.
t_sea_k = 291.0
wind_speed_mps = 7.0
choppiness = 1.0

[sky]
sun_elevation_deg = 30.0
sun_bearing_deg = 135.0
aerosol_density = 1.0

[[objects]]
preset = "container_ship"
range_m = 2000.0
bearing_deg = 15.0
heading_deg = 250.0
